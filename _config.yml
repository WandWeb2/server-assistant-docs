# Jekyll configuration for the Server Assistant documentation site.
# Hosted on GitHub Pages — https://wandweb2.github.io/server-assistant-docs/

title: Server Assistant
tagline: Privacy-first Discord moderation — with optional AI enhancement.
description: >-
  Privacy-first Discord moderation bot. Full mod toolkit, AutoMod, anti-raid,
  audit logs, a Minecraft ↔ Discord bridge, and a four-section settings hub —
  all free. Premium adds an AI Concierge that reads your server and proposes
  specific improvements.
url: https://wandweb2.github.io
baseurl: /server-assistant-docs
lang: en-GB

# MCDC plugin — the jar is hosted at /downloads/mcdc-plugin.jar (served from this
# site) so customers can download it without access to the private plugin repo.
# Bump this when a new plugin jar is dropped into downloads/.
mcdc_plugin_version: v0.28.0

# Hero / social-share image (used by Open Graph and Twitter Cards)
image: /assets/banner.jpeg

# Author — string form so Minima's footer renders it as plain text, not as
# the YAML hash literal. jekyll-seo-tag still picks this up for og:author.
author: WandWeb2

# Repository — used by jekyll-seo-tag to populate "see source" link metadata.
repository: WandWeb2/server-assistant-docs

# Use the bundled "minima" theme — looks clean out of the box, no custom CSS needed.
theme: minima

minima:
  social_links:
    github: WandWeb2/server-assistant
  show_excerpts: false

# GitHub Pages whitelist plugins — auto-enabled in the GH Pages build.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Header logo for the theme
logo: /assets/logo.png

# Top-nav: trimmed to the marketing funnel (Setup → Features → Pricing →
# Compare → Roadmap). Deeper pages (Commands, FAQ, Support, Changelog) stay
# fully reachable via the footer — they just don't clutter the header.
#
# The list itself has MOVED to `_data/nav.yml`, which is now the single source
# for both the header nav and the footer link groups. `header_pages` was a
# second hand-maintained copy of the same links, invisible to the footer, so a
# rename fixed one and rotted the other. Do not reintroduce it here: nothing
# reads it any more (`_includes/header.html` reads `site.data.nav`), so an entry
# added back would be silently ignored.

# Pretty URLs: /privacy/ instead of /privacy.html
permalink: /:title/

# Markdown rendering
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# Default front-matter values applied to every page (jekyll-seo-tag picks these up).
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      image: /assets/banner.jpeg

# Don't include drafts or other Jekyll noise in the build
exclude:
  - README.md
  - SECURITY.md
  - MAINTAINING.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - CLAUDE.md
  - scripts/
  - .omp/
  # SAi knowledge base — fetched RAW at runtime and injected into SAi's system
  # prompts. Excluded so Jekyll doesn't turn it into an HTML page; it stays a
  # plain static file at the repo path (reachable via the raw GitHub URL).
  - sai-knowledge.md
