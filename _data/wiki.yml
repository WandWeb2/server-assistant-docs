# ============================================================================
# Server Assistant Wiki — sidebar navigation (single source of truth).
#
# This drives the wiki sidebar (rendered in _layouts/wiki.html) and the order
# pages appear in. Add a page here when you create it under /wiki/.
#
#   categories:
#     - title:  group heading shown in the sidebar
#       items:
#         - label:   link text
#           url:     the page's permalink (must match the page front matter)
#           premium: true   # optional — shows a small PREMIUM tag
#
# Usage-first structure: five sections (Getting Started, Features, Moderation,
# Settings, Premium). Each page's `wiki_category` front matter must match its
# section title here (it drives the breadcrumb). The changelog is no longer a
# sidebar section: it lives at /changelog/ with SA Bot / Portal / Crestbound tabs.
#
# Only list pages that actually exist — every url here renders as a link, so a
# url with no page behind it is a broken link.
# ============================================================================
categories:
  - title: "Getting Started"
    items:
      - { label: "Overview", url: "/wiki/" }
      - { label: "Main features", url: "/wiki/features/" }
      - { label: "The /setup wizard", url: "/wiki/setup/" }
      - { label: "Commands", url: "/wiki/commands/" }

  - title: "Features"
    items:
      - { label: "Pulse", url: "/wiki/pulse/" }
      - { label: "SAi (AI assistant)", url: "/wiki/ai/" }
      - { label: "Welcome & verification", url: "/wiki/members/" }
      - { label: "Tickets & support", url: "/wiki/tickets/" }
      - { label: "XP & leveling", url: "/wiki/leveling/" }
      - { label: "Crestbound", url: "/wiki/crestbound/" }
      - { label: "Emotes & fun", url: "/wiki/emotes/" }
      - { label: "Roll", url: "/wiki/roll/" }

  - title: "Moderation"
    items:
      - { label: "Moderation & safety", url: "/wiki/moderation/" }
      - { label: "AutoMod", url: "/wiki/automod/" }
      - { label: "Ban appeals", url: "/wiki/ban-appeals/" }
      - { label: "Alt / ban-evasion", url: "/wiki/altguard/" }
      - { label: "Anti-nuke / rogue-admin", url: "/wiki/anti-nuke/" }
      - { label: "ThreatNet", url: "/wiki/threatnet/" }
      - { label: "Audit log", url: "/wiki/audit-log/" }

  - title: "Settings"
    items:
      - { label: "Settings & configuration", url: "/wiki/settings/" }

  - title: "Premium"
    items:
      - { label: "Account & Premium", url: "/wiki/account/" }
